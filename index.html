<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>细胞防线 - 明日方舟风塔防（PC桌面版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121216; color: #d4d4d4; display: flex; height: 100vh; overflow: hidden; }

        /* PC端左右两栏布局 */
        .pc-container { display: flex; width: 100vw; height: 100vh; }
        
        /* 左侧主战场与控制区 */
        .main-panel { flex: 3; display: flex; flex-direction: column; border-right: 1px solid #2d2d3b; background: #16161a; }
        
        /* 顶部状态栏 */
        .top-bar { background: #1c1c24; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3b; font-size: 15px; }
        .res-badge { background: #252533; padding: 6px 15px; border-radius: 20px; color: #4facfe; font-weight: bold; border: 1px solid #38384d; }
        .hp-badge { color: #ff5252; font-weight: bold; }

        /* 战场画板区 */
        .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #141418; position: relative; }
        canvas { background: #1a1a24; border: 2px solid #2d2d3b; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* 底部干员坞与操作栏 */
        .dock-area { background: #1c1c24; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-top: 1px solid #2d2d3b; }
        .operator-list { display: flex; gap: 15px; overflow-x: auto; }
        .operator-card {
            min-width: 110px; background: #22222e; border: 2px solid #38384d; border-radius: 12px;
            padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .operator-card:hover { border-color: #4facfe; transform: translateY(-2px); }
        .operator-card.selected { border-color: #4facfe; background: #1f304a; box-shadow: 0 0 10px rgba(79,172,254,0.3); }
        .operator-card .cost { font-size: 13px; color: #ffb142; margin-top: 4px; font-weight: bold; }
        .operator-card .name { font-size: 14px; color: #fff; font-weight: bold; }
        .operator-card .desc { font-size: 11px; color: #888; margin-top: 2px; }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-primary { background: #4facfe; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #3598db; }
        .btn-secondary { background: #2a2a38; color: #ccc; border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; cursor: pointer; }
        .btn-secondary:hover { background: #38384d; color: #fff; }

        /* 右侧侧边栏（档案、编队与设置） */
        .sidebar { flex: 1.2; background: #1a1a22; display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto; }
        .card-box { background: #22222e; border: 1px solid #333342; border-radius: 12px; padding: 18px; }
        .card-title { font-size: 15px; font-weight: bold; color: #4facfe; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        input, textarea { width: 100%; background: #141418; border: 1px solid #333342; border-radius: 8px; padding: 10px; color: #fff; font-size: 13px; outline: none; margin-bottom: 10px; }
        input:focus { border-color: #4facfe; }
    </style>
</head>
<body>

<div class="pc-container">
    <!-- 左侧：核心战场与部署区 -->
    <div class="main-panel">
        <div class="top-bar">
            <div><span class="hp-badge">❤️ 基地核心生命: <span id="baseHp">15</span></span></div>
            <div style="font-size: 16px; font-weight: bold;">作战区域：<span id="waveNum" style="color:#4facfe;">1</span> / 5 波次</div>
            <div class="res-badge">⚡ ATP 能量: <span id="atpVal">15</span></div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="700" height="420"></canvas>
        </div>

        <div class="dock-area">
            <div style="display:flex; justify-content:space-between; align-items:center; font-size: 13px;">
                <span style="color: #aaa;">请在下方选择干员，然后点击上方网格进行部署：</span>
                <span id="tipMsg" style="color: #ffb142; font-weight:bold;">请选择干员卡片</span>
            </div>
            <div class="operator-list" id="operatorList"></div>
            <div class="controls-row">
                <button class="btn-secondary" onclick="resetGame()">重置战场</button>
                <button class="btn-primary" onclick="startWave()">🚀 开始本波敌袭</button>
            </div>
        </div>
    </div>

    <!-- 右侧：干员编队、剧情与设置侧边栏 -->
    <div class="sidebar">
        <div class="card-box">
            <div class="card-title">🛡️ 细胞卫士名册</div>
            <div id="rosterList" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto;"></div>
        </div>

        <div class="card-box">
            <div class="card-title">➕ 招募/添加新干员</div>
            <input type="text" id="newOpName" placeholder="干员名称（如：内切酶）">
            <input type="number" id="newOpCost" placeholder="部署 ATP 消耗（如：7）">
            <input type="text" id="newOpDesc" placeholder="干员简要特性描述">
            <button class="btn-primary" onclick="addNewOperator()" style="width:100%;">保存并加入作战编队</button>
        </div>

        <div class="card-box">
            <div class="card-title">📖 作战情报与档案</div>
            <div style="font-size: 13px; color: #aaa; line-height: 1.6;">
                当前作战：<b>微观防线歼灭战</b><br>
                敌方目标：阻击所有变异病原体，保护核心细胞核不被侵蚀。<br>
                <i style="color:#666;">“每一次 ATP 的跳动，都是生命的交响。”</i>
            </div>
        </div>

        <div class="card-box">
            <div class="card-title">⚙ 调试与设置</div>
            <button class="btn-secondary" onclick="localStorage.clear(); location.reload();" style="width:100%; color:#ff5252;">恢复默认数据与重置</button>
        </div>
    </div>
</div>

<script>
    let operators = JSON.parse(localStorage.getItem('td_operators')) || [
        { id: 1, name: "T细胞", cost: 5, atk: 12, range: 110, desc: "单体物理输出" },
        { id: 2, name: "巨噬细胞", cost: 8, atk: 9, range: 90, desc: "高阻挡/范围清理" },
        { id: 3, name: "抗体狙击", cost: 6, atk: 16, range: 160, desc: "远程高伤狙击" }
    ];

    let atp = 15;
    let baseHp = 15;
    let wave = 1;
    let selectedOp = null;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 电脑端更宽敞的网格 (10列 6行)
    const cols = 10;
    const rows = 6;
    const tileSize = 70; // 放大格子，适合鼠标点击
    let grid = Array(rows).fill().map(() => Array(cols).fill(null));
    let enemies = [];
    let waveInProgress = false;

    function renderOperators() {
        const list = document.getElementById('operatorList');
        list.innerHTML = operators.map((op, idx) => `
            <div class="operator-card ${selectedOp === op ? 'selected' : ''}" onclick="selectOperator(${idx})">
                <div class="name">${op.name}</div>
                <div class="cost">⚡ ${op.cost} ATP</div>
                <div class="desc">${op.desc}</div>
            </div>
        `).join('');

        const rosterList = document.getElementById('rosterList');
        if(rosterList) {
            rosterList.innerHTML = operators.map(op => `
                <div style="background:#141418; padding:8px 12px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                    <div><b>${op.name}</b> <span style="color:#777;">(${op.desc})</span></div>
                    <div style="color:#ffb142; font-weight:bold;">${op.cost} ATP</div>
                </div>
            `).join('');
        }
    }

    function selectOperator(idx) {
        selectedOp = operators[idx];
        document.getElementById('tipMsg').innerText = `已选择: ${selectedOp.name} (请在网格中点击放置)`;
        renderOperators();
    }

    // 鼠标点击画板放置干员
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);

        if(r >= 0 && r < rows && c >= 0 && c < cols) {
            if(!selectedOp) {
                alert("请先在下方点击选择一个干员！");
                return;
            }
            if(atp < selectedOp.cost) {
                alert("ATP 能量不足，无法部署！");
                return;
            }
            if(grid[r][c] !== null) {
                alert("该网格位置已经部署了干员！");
                return;
            }

            atp -= selectedOp.cost;
            grid[r][c] = { ...selectedOp, x: c * tileSize + tileSize/2, y: r * tileSize + tileSize/2 };
            updateUI();
        }
    });

    function startWave() {
        if(waveInProgress) return;
        waveInProgress = true;
        
        let spawned = 0;
        let totalEnemies = 4 + wave * 3;

        let spawnTimer = setInterval(() => {
            if(spawned < totalEnemies) {
                enemies.push({
                    x: cols * tileSize,
                    y: Math.floor(Math.random() * rows) * tileSize + tileSize/2,
                    hp: 40 + wave * 15,
                    maxHp: 40 + wave * 15,
                    speed: 0.9 + wave * 0.1,
                    atk: 1
                });
                spawned++;
            } else {
                clearInterval(spawnTimer);
            }
        }, 1400);
    }

    function updateGame() {
        // 自动回复 ATP
        if(Math.random() < 0.025) {
            atp = Math.min(40, atp + 1);
            updateUI();
        }

        // 敌人移动与攻击
        for(let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            en.x -= en.speed;

            if(en.x <= 0) {
                baseHp -= en.atk;
                enemies.splice(i, 1);
                updateUI();
                if(baseHp <= 0) {
                    alert("防线被病原体攻破！游戏结束。");
                    resetGame();
                }
                continue;
            }

            // 干员攻击判定
            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    let op = grid[r][c];
                    if(op) {
                        let opX = c * tileSize + tileSize/2;
                        let opY = r * tileSize + tileSize/2;
                        let dist = Math.hypot(en.x - opX, en.y - opY);
                        if(dist <= op.range) {
                            en.hp -= 0.6;
                        }
                    }
                }
            }

            if(en.hp <= 0) {
                enemies.splice(i, 1);
                atp += 3; // 击杀奖励
                updateUI();
            }
        }

        drawGame();
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制网格
        ctx.strokeStyle = '#232330';
        ctx.lineWidth = 1;
        for(let r = 0; r <= rows; r++) {
            ctx.beginPath(); ctx.moveTo(0, r * tileSize); ctx.lineTo(cols * tileSize, r * tileSize); ctx.stroke();
        }
        for(let c = 0; c <= cols; c++) {
            ctx.beginPath(); ctx.moveTo(c * tileSize, 0); ctx.lineTo(c * tileSize, rows * tileSize); ctx.stroke();
        }

        // 绘制已部署干员
        for(let r = 0; r < rows; r++) {
            for(let c = 0; c < cols; c++) {
                let op = grid[r][c];
                if(op) {
                    ctx.fillStyle = '#4facfe';
                    ctx.beginPath();
                    ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(op.name, c * tileSize + tileSize/2, r * tileSize + tileSize/2 + 4);
                }
            }
        }

        // 绘制敌人
        for(let en of enemies) {
            ctx.fillStyle = '#ff5252';
            ctx.beginPath();
            ctx.arc(en.x, en.y, 14, 0, Math.PI * 2);
            ctx.fill();

            // 血条
            ctx.fillStyle = '#222';
            ctx.fillRect(en.x - 18, en.y - 24, 36, 5);
            ctx.fillStyle = '#4cd137';
            ctx.fillRect(en.x - 18, en.y - 24, 36 * (en.hp / en.maxHp), 5);
        }
    }

    function updateUI() {
        document.getElementById('atpVal').innerText = atp;
        document.getElementById('baseHp').innerText = baseHp;
        document.getElementById('waveNum').innerText = wave;
    }

    function resetGame() {
        grid = Array(rows).fill().map(() => Array(cols).fill(null));
        enemies = [];
        atp = 15;
        baseHp = 15;
        wave = 1;
        waveInProgress = false;
        updateUI();
    }

    function addNewOperator() {
        const name = document.getElementById('newOpName').value.trim();
        const cost = parseInt(document.getElementById('newOpCost').value);
        const desc = document.getElementById('newOpDesc').value.trim();
        if(!name || isNaN(cost)) {
            alert("请完整填写名称和 ATP 消耗！");
            return;
        }
        operators.push({ id: operators.length + 1, name, cost, atk: 12, range: 120, desc: desc || "自定义干员" });
        localStorage.setItem('td_operators', JSON.stringify(operators));
        document.getElementById('newOpName').value = '';
        document.getElementById('newOpCost').value = '';
        document.getElementById('newOpDesc').value = '';
        renderOperators();
        alert("新干员已成功加入作战编队！");
    }

    renderOperators();
    updateUI();
    setInterval(updateGame, 50);
</script>
</body>
</html>
