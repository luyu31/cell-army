<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>细胞防线 - 生物学真实寿命与全年龄段演进版（PC桌面版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121216; color: #d4d4d4; display: flex; height: 100vh; overflow: hidden; }

        .pc-container { display: flex; width: 100vw; height: 100vh; }
        
        .main-panel { flex: 3; display: flex; flex-direction: column; border-right: 1px solid #2d2d3b; background: #16161a; }
        .top-bar { background: #1c1c24; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3b; font-size: 14px; }
        .res-badge { background: #252533; padding: 5px 12px; border-radius: 20px; color: #4facfe; font-weight: bold; border: 1px solid #38384d; display: flex; align-items: center; gap: 6px; }
        .nut-badge { color: #f39c12; font-weight: bold; background: #2a251c; border-color: #523e1a; }
        .hp-badge { color: #ff5252; font-weight: bold; }

        .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #141418; position: relative; }
        canvas { background: #1a1a24; border: 2px solid #2d2d3b; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; }

        .dock-area { background: #1c1c24; padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #2d2d3b; }
        .operator-list { display: flex; gap: 10px; overflow-x: auto; min-height: 85px; align-items: center; }
        .operator-card {
            min-width: 125px; background: #22222e; border: 2px solid #38384d; border-radius: 10px;
            padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; flex-shrink: 0;
        }
        .operator-card:hover { border-color: #4facfe; transform: translateY(-2px); }
        .operator-card.selected { border-color: #4facfe; background: #1f304a; box-shadow: 0 0 10px rgba(79,172,254,0.3); }
        .operator-card .cost { font-size: 11px; color: #ffb142; margin-top: 2px; font-weight: bold; }
        .operator-card .name { font-size: 12px; color: #fff; font-weight: bold; }
        .operator-card .desc { font-size: 9px; color: #888; margin-top: 2px; }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-primary { background: #4facfe; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #3598db; }
        .btn-secondary { background: #2a2a38; color: #ccc; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; }
        .btn-secondary:hover { background: #38384d; color: #fff; }
        .btn-tab { background: #6c5ce7; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-tab:hover { background: #5f3dc4; }

        .sidebar { flex: 1.3; background: #1a1a22; display: flex; flex-direction: column; padding: 20px; gap: 15px; overflow-y: auto; }
        .card-box { background: #22222e; border: 1px solid #333342; border-radius: 12px; padding: 16px; }
        .card-title { font-size: 14px; font-weight: bold; color: #4facfe; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        .gacha-box { background: linear-gradient(135deg, #22222e, #2a2238); border: 1px solid #6c5ce7; text-align: center; padding: 15px; border-radius: 12px; }
        .btn-gacha { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; }

        .warehouse-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 8px; max-height: 280px; overflow-y: auto; }
        .wh-item { background: #181820; border: 1px solid #333342; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .level-list { display: flex; flex-direction: column; gap: 6px; max-height: 170px; overflow-y: auto; }
        .level-item { background: #16161a; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border: 1px solid #2a2a38; cursor: pointer; }
        .level-item.active { border-color: #4facfe; background: #1f304a; }
    </style>
</head>
<body>

<div class="pc-container">
    <div class="main-panel">
        <div class="top-bar">
            <div><span class="hp-badge">❤️️ 宿主基底生命: <span id="baseHp">15</span></span></div>
            <div style="font-weight: bold; color: #f39c12;" id="levelTitleDisplay">当前关卡：第 1 关 (儿童期)</div>
            <div style="display:flex; gap:12px;">
                <div class="res-badge nut-badge">🧪 营养: <span id="nutVal">60</span></div>
                <div class="res-badge">⚡ ATP: <span id="atpVal">25</span></div>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="770" height="400"></canvas>
        </div>

        <div class="dock-area">
            <div style="display:flex; justify-content:space-between; align-items:center; font-size: 13px;">
                <span style="color: #aaa;" id="tipMsg">注意不同细胞的真实生物学寿命与宿主年龄状态！</span>
                <button class="btn-tab" onclick="switchPanel()">🧬 进入营养诱导与活化中心</button>
            </div>
            <div class="operator-list" id="operatorList"></div>
            <div class="controls-row">
                <button class="btn-secondary" onclick="resetGame()">重置当前关卡</button>
                <button class="btn-primary" onclick="startWave()">🚀 开始免疫防线战</button>
            </div>
        </div>
    </div>

    <!-- 右侧动态面板 -->
    <div class="sidebar" id="rightSidebar">
        <!-- 默认：关卡选择 -->
        <div id="panelBattle">
            <div class="card-box">
                <div class="card-title">🗺️ 人体全年龄段关卡 (1-10关)</div>
                <div class="level-list" id="levelList"></div>
            </div>

            <div class="card-box">
                <div class="card-title">🧬 年龄与细胞寿命说明</div>
                <div style="font-size: 11px; color: #aaa; line-height: 1.5;">
                    • <b>第 1-3 关 (儿童期)</b>：免疫幼稚，敌人温和。<br>
                    • <b>第 4-5 关 (青少年期)</b>：免疫力上升，细胞寿命标准。<br>
                    • <b>第 6-7 关 (成年期)</b>：巅峰战力，病毒侵袭加剧。<br>
                    • <b>第 8-10 关 (老年期)</b>：免疫机能老化，**所有干员自然寿命与抗击能力大打折扣**！
                </div>
            </div>
        </div>

        <!-- 切换后：诱导分化与细胞活化面板 -->
        <div id="panelGacha" style="display:none;">
            <div class="gacha-box">
                <div style="font-size: 15px; font-weight: bold; color: #f39c12;">🔬 骨髓干细胞营养诱导分化中心</div>
                <div style="font-size: 11px; color: #aaa; margin-top: 4px;">消耗营养进行诱导，分化出新型细胞群落！</div>
                <button class="btn-gacha" onclick="pullGacha(1)">单次诱导分化 (消耗 15 营养)</button>
                <button class="btn-gacha" onclick="pullGacha(10)" style="background: linear-gradient(135deg, #8e44ad, #9b59b6);">十连诱导分化 (消耗 135 营养)</button>
            </div>

            <div class="card-box">
                <div class="card-title">🧺 细胞群落仓库与细胞活化</div>
                <div class="warehouse-grid" id="warehouseGrid"></div>
            </div>
            <button class="btn-secondary" onclick="switchPanel()" style="width:100%; margin-top: 5px;">返回战场作战</button>
        </div>
    </div>
</div>

<script>
    // 细胞大师库：严格依据真实人体细胞寿命比例设定基础生命周期 (lifeFrames，60帧约1秒)
    const masterPool = [
        { id: 'neutrophil', name: "中性粒细胞", rarity: 'N', weight: 45, cost: 4, maxCount: 6, rangeType: 'front1', baseAtk: 10, maxLifeSec: 8, desc: "寿命短(约8秒)，短命而高效" },
        { id: 'rbc', name: "红细胞", rarity: 'R', weight: 30, cost: 3, maxCount: 8, rangeType: 'front1', baseAtk: 7, maxLifeSec: 22, desc: "寿命最长(约22秒)，基础稳固" },
        { id: 'macrophage', name: "巨噬细胞", rarity: 'SR', weight: 15, cost: 8, maxCount: 3, rangeType: 'front1', baseAtk: 25, maxLifeSec: 15, desc: "近战凶猛，寿命中等(15秒)" },
        { id: 'tcell', name: "成熟T淋巴细胞", rarity: 'SSR', weight: 8, cost: 10, maxCount: 2, rangeType: 'circle1', baseAtk: 22, maxLifeSec: 12, desc: "攻击周围一圈，寿命12秒" },
        { id: 'nkcell', name: "NK自然杀手细胞", rarity: 'SSR', weight: 2, cost: 12, maxCount: 1, rangeType: 'cross2', baseAtk: 38, maxLifeSec: 10, desc: "终极免疫，十字穿透，寿命10秒" }
    ];

    let playerWarehouse = JSON.parse(localStorage.getItem('td_warehouse_v4')) || [
        { ...masterPool[0], count: 2, potential: 1 },
        { ...masterPool[1], count: 2, potential: 1 }
    ];

    let nutrients = parseInt(localStorage.getItem('td_nutrients_v4')) || 60;
    let atp = 25;
    let baseHp = 15;
    let currentLevel = 1;
    let selectedOp = null;
    let waveInProgress = false;
    let currentView = 'battle';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const cols = 11;
    const rows = 5;
    const tileSize = 70;
    let grid = Array(rows).fill().map(() => Array(cols).fill(null));
    let enemies = [];

    // 10个关卡：精确划分 4 个年龄段
    const levels = [
        { id: 1, ageGroup: '儿童期', name: "第 1 关: 儿童末梢微循环 (流感入侵)", enemyHp: 30, enemyCount: 6, rewardNut: 25 },
        { id: 2, ageGroup: '儿童期', name: "第 2 关: 乳牙期扁桃体防线 (链球菌)", enemyHp: 40, enemyCount: 8, rewardNut: 30 },
        { id: 3, ageGroup: '儿童期', name: "第 3 关: 幼儿期气道黏膜 (支原体)", enemyHp: 50, enemyCount: 10, rewardNut: 35 },
        { id: 4, ageGroup: '青少年期', name: "第 4 关: 学龄前淋巴结阵地 (腺病毒)", enemyHp: 65, enemyCount: 11, rewardNut: 40 },
        { id: 5, ageGroup: '青少年期', name: "第 5 关: 青少年肝脏解毒区 (乙肝突袭)", enemyHp: 80, enemyCount: 12, rewardNut: 45 },
        { id: 6, ageGroup: '成年期', name: "第 6 关: 脾脏免疫过滤网 (强效细菌)", enemyHp: 100, enemyCount: 14, rewardNut: 50 },
        { id: 7, ageGroup: '成年期', name: "第 7 关: 中枢神经血脑屏障 (强敌突破)", enemyHp: 120, enemyCount: 15, rewardNut: 60 },
        { id: 8, ageGroup: '老年期', name: "第 8 关: 老年期胃酸防御衰退圈", enemyHp: 150, enemyCount: 16, rewardNut: 70 },
        { id: 9, ageGroup: '老年期', name: "第 9 关: 冠状动脉硬化险地 (老化病毒)", enemyHp: 180, enemyCount: 18, rewardNut: 80 },
        { id: 10, ageGroup: '老年期', name: "第 10 关: 老年期全身免疫总决战", enemyHp: 220, enemyCount: 22, rewardNut: 100 }
    ];

    function renderLevelList() {
        const list = document.getElementById('levelList');
        list.innerHTML = levels.map(lvl => `
            <div class="level-item ${currentLevel === lvl.id ? 'active' : ''}" onclick="selectLevel(${lvl.id})">
                <div><b>${lvl.name}</b></div>
                <div style="color: #f39c12;">🧪${lvl.rewardNut}</div>
            </div>
        `).join('');
    }

    function selectLevel(lvlId) {
        if(waveInProgress) { alert("战斗中无法切换关卡！"); return; }
        currentLevel = lvlId;
        let lvl = levels[lvlId-1];
        document.getElementById('levelTitleDisplay').innerText = `当前关卡：第 ${lvl.id} 关 (${lvl.ageGroup})`;
        renderLevelList();
        resetGame();
    }

    function renderOperators() {
        const list = document.getElementById('operatorList');
        list.innerHTML = playerWarehouse.map((op, idx) => `
            <div class="operator-card ${selectedOp === op ? 'selected' : ''}" onclick="selectOperator(${idx})">
                <div class="name">${op.name} <span style="color:#f39c12; font-size:10px;">P${op.potential}</span></div>
                <div class="cost">⚡ ${op.cost} ATP</div>
                <div style="font-size:9px; color:#4facfe;">寿命:约${op.maxLifeSec}秒</div>
                <div class="desc">${op.desc}</div>
            </div>
        `).join('');
    }

    function selectOperator(idx) {
        selectedOp = playerWarehouse[idx];
        document.getElementById('tipMsg').innerText = `已选择: ${selectedOp.name} (潜能P${selectedOp.potential}，真实生物学寿命约 ${selectedOp.maxLifeSec} 秒)`;
        renderOperators();
    }

    function switchPanel() {
        if(currentView === 'battle') {
            currentView = 'gacha';
            document.getElementById('panelBattle').style.display = 'none';
            document.getElementById('panelGacha').style.display = 'block';
            renderWarehouse();
        } else {
            currentView = 'battle';
            document.getElementById('panelGacha').style.display = 'none';
            document.getElementById('panelBattle').style.display = 'block';
        }
    }

    function renderWarehouse() {
        document.getElementById('nutVal').innerText = nutrients;
        const whGrid = document.getElementById('warehouseGrid');
        whGrid.innerHTML = playerWarehouse.map((op, idx) => `
            <div class="wh-item">
                <div>
                    <div style="font-weight:bold; color:#fff; font-size:12px;">${op.name} <span style="color:#f39c12;">[潜能 P${op.potential}]</span></div>
                    <div style="font-size:10px; color:#aaa;">细胞群落储量: ${op.count} | 攻击: ${op.baseAtk * op.potential}</div>
                </div>
                <button class="btn-primary" style="padding:4px 10px; font-size:11px;" onclick="activateOperator(${idx})">细胞活化 (🧪20)</button>
            </div>
        `).join('');
    }

    function activateOperator(idx) {
        let op = playerWarehouse[idx];
        if(nutrients < 20) { alert("营养不足！"); return; }
        nutrients -= 20;
        op.baseAtk += 5;
        localStorage.setItem('td_nutrients_v4', nutrients);
        localStorage.setItem('td_warehouse_v4', JSON.stringify(playerWarehouse));
        renderWarehouse();
        renderOperators();
        alert(`✨ ${op.name} 细胞活化成功！生理活性与攻击力提升。`);
    }

    function pullGacha(amount) {
        let costTotal = amount === 1 ? 15 : 135;
        if(nutrients < costTotal) { alert("营养不足！请去通关获取奖励。"); return; }
        nutrients -= costTotal;
        localStorage.setItem('td_nutrients_v4', nutrients);

        let results = [];
        for(let i = 0; i < amount; i++) {
            let rand = Math.random() * 100;
            let cumulative = 0;
            let chosenMaster = masterPool[0];
            for(let p of masterPool) {
                cumulative += p.weight;
                if(rand <= cumulative) { chosenMaster = p; break; }
            }
            results.push(chosenMaster.name);

            let existing = playerWarehouse.find(item => item.id === chosenMaster.id);
            if(existing) {
                existing.count += 1;
                existing.potential += 1;
                existing.baseAtk += 4;
            } else {
                playerWarehouse.push({ ...chosenMaster, count: 1, potential: 1 });
            }
        }

        localStorage.setItem('td_nutrients_v4', JSON.stringify(playerWarehouse));
        renderWarehouse();
        renderOperators();
        alert(`🎉 营养诱导分化获得：\n${results.join(', ')}\n(重复细胞已自动转化为群落潜能与战力突破！)`);
    }

    function getAttackedGridsForOperator(opR, opC, rangeType) {
        let list = [];
        for(let r = 0; r < rows; r++) {
            for(let c = 0; c < cols; c++) {
                if(rangeType === 'front1') {
                    if(r === opR && c === opC + 1) list.push({r, c});
                } else if(rangeType === 'circle1') {
                    if(Math.abs(r - opR) <= 1 && Math.abs(c - opC) <= 1) list.push({r, c});
                } else if(rangeType === 'cross2') {
                    if((r === opR && Math.abs(c - opC) <= 2) || (c === opC && Math.abs(r - opR) <= 2)) list.push({r, c});
                }
            }
        }
        return list;
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);

        if(r >= 0 && r < rows && c >= 0 && c < cols) {
            if(!selectedOp) { alert("请先选择细胞！"); return; }
            if(atp < selectedOp.cost) { alert("ATP 能量不足！"); return; }
            if(grid[r][c] !== null) { alert("该网格已有细胞！"); return; }

            let deployedCount = 0;
            for(let ro = 0; ro < rows; ro++) {
                for(let co = 0; co < cols; co++) {
                    if(grid[ro][co] && grid[ro][co].id === selectedOp.id) deployedCount++;
                }
            }
            if(deployedCount >= selectedOp.maxCount) {
                alert(`该细胞部署数量已达到人体比例上限 (${selectedOp.maxCount})！`);
                return;
            }

            atp -= selectedOp.cost;

            // 根据关卡年龄段计算寿命衰减系数（老年期细胞寿命缩短30%）
            let ageFactor = currentLevel >= 8 ? 0.7 : (currentLevel >= 6 ? 0.9 : 1.0);
            let totalFrames = Math.floor(selectedOp.maxLifeSec * 60 * ageFactor);

            grid[r][c] = { 
                ...selectedOp, 
                r, c, 
                atk: selectedOp.baseAtk * selectedOp.potential,
                lifeTimer: totalFrames,
                maxLifeTimer: totalFrames
            };
            updateUI();
        }
    });

    function startWave() {
        if(waveInProgress) return;
        waveInProgress = true;
        let lvlData = levels[currentLevel - 1];
        let spawned = 0;

        let spawnTimer = setInterval(() => {
            if(spawned < lvlData.enemyCount) {
                let enemyAtkBonus = currentLevel >= 8 ? 1.4 : 1;
                enemies.push({
                    x: cols * tileSize - 10,
                    y: Math.floor(Math.random() * rows) * tileSize + tileSize/2,
                    hp: lvlData.enemyHp,
                    maxHp: lvlData.enemyHp,
                    speed: 0.6 + currentLevel * 0.02,
                    atk: (5 + currentLevel * 1.2) * enemyAtkBonus,
                    currentR: 0,
                    currentC: 0
                });
                spawned++;
            } else {
                clearInterval(spawnTimer);
            }
        }, 1500);
    }

    function updateGame() {
        if(Math.random() < 0.03) {
            atp = Math.min(60, atp + 1);
            updateUI();
        }

        // 1. 更新网格上的细胞（寿命倒计时与双向互殴）
        for(let r = 0; r < rows; r++) {
            for(let c = 0; c < cols; c++) {
                let op = grid[r][c];
                if(op) {
                    op.lifeTimer -= 1;
                    if(op.lifeTimer <= 0) {
                        grid[r][c] = null; // 细胞自然凋亡
                        continue;
                    }

                    let targetGrids = getAttackedGridsForOperator(r, c, op.rangeType);
                    for(let en of enemies) {
                        let inRange = targetGrids.some(tg => tg.r === en.currentR && tg.c === en.currentC);
                        if(inRange) {
                            en.hp -= (op.atk * 0.05);
                        }
                    }
                }
            }
        }

        // 2. 更新敌人
        for(let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            en.x -= en.speed;
            en.currentC = Math.max(0, Math.min(cols - 1, Math.floor(en.x / tileSize)));
            en.currentR = Math.max(0, Math.min(rows - 1, Math.floor(en.y / tileSize)));

            // 敌人与所在格子的细胞发生拦截交互
            let cell = grid[en.currentR][en.currentC];
            if(cell) {
                en.x += en.speed * 0.8; // 受阻减速
                cell.lifeTimer -= 1.5;  // 敌人的攻击会加速细胞消耗/凋亡
            }

            if(en.hp <= 0) {
                enemies.splice(i, 1);
            } else if(en.x <= 0) {
                baseHp -= 1;
                enemies.splice(i, 1);
                updateUI();
                if(baseHp <= 0) {
                    alert("宿主免疫防线崩溃！游戏失败。");
                    resetGame();
                }
            }
        }
